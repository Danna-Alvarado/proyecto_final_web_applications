<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>History</title>
<meta name="viewpsort" content="width=device-width, initial-scale=1.0">

<style>

body {
background: linear-gradient(black, #111);
color: white;
font-family: Arial;
margin: 0;
}

header {
background: #111;
padding: 20px;
text-align: center;
border-bottom: 2px solid red;
}

/* BOTON BACK */
.volver {
position: fixed;
top: 15px;
right: 15px;
background: red;
padding: 10px;
color: white;
text-decoration: none;
border-radius: 8px;
font-size: 14px;
}

/* CONTENEDOR */
.table-container {
width: 100%;
overflow-x: auto;
padding: 10px;
box-sizing: border-box;
}

table {
width: 100%;
border-collapse: collapse;
margin-top: 20px;
min-width: 600px; 
}

th {
background: red;
padding: 10px;
font-size: 14px;
}

td {
padding: 10px;
text-align: center;
border-bottom: 1px solid #333;
font-size: 14px;
}

.total-box {
text-align: center;
font-size: 22px;
margin-top: 20px;
font-weight: bold;
}

/* MEDIA QUERY PARA CELULARES */
@media (max-width: 600px) {

header {
font-size: 18px;
padding: 15px;
}

.total-box {
font-size: 18px;
}

.volver {
font-size: 12px;
padding: 8px;
}

}

</style>

</head>

<body>

<header>
📊 Daily Sales History
</header>

<a href="/dashboard" class="volver">
⬅ Back
</a>


<div id="total-dia" class="total-box">
💰 Daily Total: $0
</div>

<div class="table-container">

<table>

<thead>

<tr>
<th>Sale ID</th>
<th>Date</th>
<th>Album</th>
<th>Quantity</th>
<th>Price</th>
<th>Total</th>
</tr>

</thead>

<tbody id="tabla-historial">

</tbody>

</table>

</div>

<script>

async function cargarHistorial() {

const res = await fetch("/historial-dia");

const data = await res.json();

let tabla = document.getElementById("tabla-historial");

tabla.innerHTML = "";

data.forEach(venta => {

tabla.innerHTML += `
<tr>

<td>${venta.venta_id}</td>

<td>${venta.fecha}</td>

<td>${venta.tittle}</td>

<td>${venta.cantidad}</td>

<td>$${venta.precio}</td>

<td>$${venta.total}</td>

</tr>
`;

});

}

// CARGAR TOTAL DEL DIA
async function cargarTotalDia() {

const res = await fetch("/total-dia");

const data = await res.json();

let total = data.total_dia || 0;

document.getElementById("total-dia").innerText =
"💰 Daily Total: $" + total;

}

cargarHistorial();
cargarTotalDia();

</script>

</body>

</html>
